# BuildShield — one command brings up the whole platform:
#
#   docker compose up --build
#
# On the first run the `setup` service asks for the GitHub token, webhook secret
# and admin account, writes `.env` at the repository root, creates the admin user
# and (optionally) registers the GitHub webhook. The API then starts with those
# values and `web` serves the dashboard.
#
# Re-running is safe: setup detects a complete `.env` and exits immediately.
# To change the configuration later:
#   docker compose run --rm -e BUILDSHIELD_RECONFIGURE=1 setup

name: buildshield

services:
  # ---------------------------------------------------------------- first run
  setup:
    build:
      context: ./services/api
    image: buildshield-api
    # Loads the existing .env when present, applies migrations, then the wizard.
    entrypoint:
      - sh
      - -c
      - |
        set -a
        [ -f /project/.env ] && . /project/.env
        set +a
        alembic upgrade head || echo '! Alembic migration skipped; the app reconciles the schema.'
        python -m app.setup_wizard
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://buildshield_user:supersecurepassword@db:5432/buildshield_db}
      BUILDSHIELD_PROJECT_DIR: /project
      BUILDSHIELD_RECONFIGURE: ${BUILDSHIELD_RECONFIGURE:-0}
    volumes:
      - ./:/project
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"

  # ---------------------------------------------------------------- database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-buildshield_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecurepassword}
      POSTGRES_DB: ${DB_NAME:-buildshield_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - buildshield_db_data_v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-buildshield_user} -d ${DB_NAME:-buildshield_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- backend
  api:
    build:
      context: ./services/api
    image: buildshield-api
    # `.env` is generated by `setup`, so it is sourced at container start rather
    # than interpolated by Compose (which would read it before the wizard ran).
    entrypoint:
      - sh
      - -c
      - |
        set -a
        [ -f /project/.env ] && . /project/.env
        set +a
        alembic upgrade head || echo '! Alembic migration skipped; the app reconciles the schema.'
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://buildshield_user:supersecurepassword@db:5432/buildshield_db}
      # Local SMTP sink; the wizard can override these in .env for real mail.
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@buildshield.local}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-20}
    volumes:
      - ./:/project:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------- dashboard
  web:
    build:
      context: ./buildshield-dashboard
      args:
        # `/` makes the bundle call the API on its own origin; nginx proxies it.
        VITE_API_URL: ${VITE_API_URL:-/}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- mail sink
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI and API

volumes:
  buildshield_db_data_v1:

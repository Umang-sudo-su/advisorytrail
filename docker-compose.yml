services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildshield_user
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: buildshield_db
    ports:
      - "5433:5432"
    volumes:
      - buildshield_db_data_v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildshield_user -d buildshield_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    # Repository credentials (GITHUB_TOKEN) live here; the entries below override host paths.
    env_file:
      - ./services/api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://buildshield_user:supersecurepassword@db:5432/buildshield_db
      - GITHUB_WEBHOOK_SECRET=my_super_secure_local_testing_secret
      # Local SMTP sink. MailHog captures every message at http://localhost:8025.
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=no-reply@buildshield.local
      - SMTP_SECURITY=none
      - SCHEDULER_TICK_SECONDS=20
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI and API

volumes:
  buildshield_db_data_v1:

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildshield_postgres
    environment:
      POSTGRES_USER: buildshield
      POSTGRES_PASSWORD: buildshield_dev_pass
      POSTGRES_DB: buildshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: buildshield_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

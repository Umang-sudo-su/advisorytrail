version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildshield_user
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: buildshield_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://buildshield_user:supersecurepassword@db:5432/buildshield_db
      - GITHUB_WEBHOOK_SECRET=my_super_secure_local_testing_secret
    depends_on:
      - db

volumes:
  postgres_data:
